name: KiCad suite (Linux)

# Separate from ci.yml because installing KiCad costs minutes of wall clock, and
# ci.yml's Python-version matrix should stay fast. Same reasoning as
# macos-discovery.yml, whose structure this mirrors.
#
# It exists because ci.yml installs no KiCad, so tests skip there (46 of 649 when
# this job was added, 2026-08-08). That was tolerable while most of them could not fail anyway: they wrapped their only
# assertion in `except (ToolError, RuntimeError, FileNotFoundError): pass`, and a
# bad scratch_pcb fixture meant every PCB export took the except branch on every
# machine. Removing that exposed three defects that had already shipped, so the
# gate is now a real coverage hole rather than a formality.
#
# Unlike macos-discovery.yml, this does run on pull requests: Linux runners are far
# cheaper than macos-15, and this guards the whole suite rather than checking one
# derivation. Drop the pull_request trigger if the added latency stops being worth
# it.
#
# It runs once per supported KiCad major. The two KiCad 10 gates, macOS and
# Windows, run only on pushes to main and ci/**, so before the 10.0 leg a pull
# request from a feature branch merged with no KiCad 10 signal at all.
on:
  workflow_dispatch:
  push:
    branches: [main, master, "ci/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  suite:
    name: suite (KiCad ${{ matrix.kicad }})
    # Pinned rather than ubuntu-latest: this depends on an external PPA, and a
    # runner image bump to a series the PPA has not built for would break the job
    # for reasons that have nothing to do with the code.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Each leg answers a different question, so one major failing must not
      # cancel the other and hide whether the fault is version-specific.
      fail-fast: false
      matrix:
        # The PPA series names, ppa:kicad/kicad-<series>-releases. Each serves
        # only its newest point release, so the patch version is whatever the
        # PPA held that day; the version check below records it in the log.
        kicad: ["9.0", "10.0"]
    env:
      KICAD_SERIES: ${{ matrix.kicad }}
    steps:
      - uses: actions/checkout@v7

      # kicad recommends kicad-libraries and kicad-demos (the routing demo tests
      # read the demos), and kicad-libraries recommends kicad-symbols and
      # kicad-footprints. --no-install-recommends would drop all of them, break
      # _resolve_system_lib, and leave ERC reporting bogus "library not found"
      # violations, disabling the coverage this job exists to add. Keep the
      # recommends and exclude only the multi-GB 3D models, via apt's
      # trailing-dash syntax. Read from both PPAs' noble Packages indexes,
      # 2026-10-10: the 9.0 PPA ships no kicad-templates, so that leg takes
      # Ubuntu's own (7.0.9); nothing here reads it beyond an existence check
      # in a run_erc hint.
      - name: Install KiCad ${{ matrix.kicad }}
        run: |
          sudo add-apt-repository -y "ppa:kicad/kicad-${KICAD_SERIES}-releases"
          sudo apt-get update
          sudo apt-get install -y kicad kicad-packages3d-

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync --frozen --all-extras --dev

      # Fatal, unlike the report below. A leg named for one major that resolved
      # another (a PPA mix-up, a stale package pulled in from the runner image)
      # would pass green while testing the wrong KiCad, which is worse than
      # failing. pcbnew is checked separately because fill_zones and
      # autoroute_pcb run under pcbnew's own interpreter, not kicad-cli.
      - name: Confirm the leg runs the KiCad it is named for
        run: |
          uv run python - <<'PY'
          import os
          import subprocess

          from mcp_server_kicad._freerouting import pcbnew_major
          from mcp_server_kicad._shared import _find_kicad_cli

          want = int(os.environ["KICAD_SERIES"].split(".")[0])
          cli = _find_kicad_cli()
          assert cli, "no kicad-cli resolved"
          version = subprocess.run(
              [cli, "version"], capture_output=True, text=True, check=True
          ).stdout.strip()
          print("kicad-cli version:", version)
          print("pcbnew major     :", pcbnew_major())
          assert int(version.split(".")[0]) == want, (version, want)
          assert pcbnew_major() == want, (pcbnew_major(), want)
          PY

      # Non-fatal. This is the first look at a real Linux install, so record what
      # resolved even when the suite passes. If tests fail on library lookup, this
      # is the step that says which resolution returned None.
      - name: Report the Linux layout
        continue-on-error: true
        run: |
          uv run python - <<'PY'
          import shutil
          import subprocess

          from mcp_server_kicad._freerouting import find_pcbnew_python
          from mcp_server_kicad._shared import (
              _find_kicad_cli,
              _kicad_root,
              _resolve_system_lib,
          )

          print("kicad-cli version:")
          subprocess.run(["kicad-cli", "version"])
          print("shutil.which      :", shutil.which("kicad-cli"))
          print("_find_kicad_cli() :", _find_kicad_cli())
          print("_kicad_root()     :", _kicad_root())
          print("Device.kicad_sym  :", _resolve_system_lib("Device"))
          print("find_pcbnew_python:", find_pcbnew_python()[0])

          root = _kicad_root()
          if root:
              print("\n--- entries under the resolved root ---")
              for p in sorted(root.iterdir()):
                  print("   ", p.name + ("/" if p.is_dir() else ""))
          PY

      # Only one Python version. kicad-cli is a subprocess and does not behave
      # differently across Python versions, so spreading this over ci.yml's
      # matrix legs would repeat a multi-minute install per leg for nothing.
      # -rs prints each skip's reason, so a leg's log says which tests did
      # not run and why.
      - run: uv run pytest -v -n auto -rs
