name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - run: uv sync --frozen --all-extras --dev

      # Lint
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

      # Test
      - run: uv run pytest -v

      # Bump version (uv version re-locks, so no separate uv lock step)
      - name: Bump version
        id: bump
        run: |
          V=$(uv version --bump "${{ inputs.bump }}" --short)
          node -e 'const fs=require("fs"),p=".claude-plugin/plugin.json",d=JSON.parse(fs.readFileSync(p,"utf8"));d.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(d,null,2)+"\n")' "$V"
          # server.json carries the version twice: the server's own version and
          # the PyPI package it points at. The MCP Registry rejects a package
          # version that is not live on PyPI, so both track the release.
          node -e 'const fs=require("fs"),p="server.json",d=JSON.parse(fs.readFileSync(p,"utf8"));d.version=process.argv[1];d.packages[0].version=process.argv[1];fs.writeFileSync(p,JSON.stringify(d,null,2)+"\n")' "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Pack the MCPB bundle. Both versions in mcpb/ are placeholders stamped
      # here rather than committed, so the bundle is not a fifth place to bump.
      # The commit below stages four explicit paths and passes no -a, so these
      # stamped files stay dirty and out of git on purpose: they are build
      # output, not repo state.
      #
      # This runs before the push so that a transient npx or network failure
      # aborts the release with nothing pushed, rather than stranding a bump
      # commit on main with no release and no PyPI upload to match it.
      #
      # The bundle lands in bundle/, never dist/, because the PyPI publish step
      # uploads everything in dist/ and would choke on a non-package file.
      #
      # No uv.lock ships with it: the manifest pins the version being released,
      # which is not live on PyPI until the last step of this job, so a lock
      # cannot be resolved yet. Users resolve on first launch instead, fenced by
      # the mcp>=1.10.0,<2.0.0 bound in the package itself.
      - name: Pack MCPB bundle
        run: |
          V="${{ steps.bump.outputs.version }}"
          mkdir -p bundle
          node -e 'const fs=require("fs"),p="mcpb/manifest.json",d=JSON.parse(fs.readFileSync(p,"utf8"));d.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(d,null,2)+"\n")' "$V"
          sed -i "s|mcp-server-kicad==[^\"]*|mcp-server-kicad==$V|" mcpb/pyproject.toml
          # A reformatted pyproject would slip past sed and ship a bundle
          # pinned to the wrong release, so confirm the stamp landed.
          grep -q "\"mcp-server-kicad==$V\"" mcpb/pyproject.toml
          npx --yes @anthropic-ai/mcpb pack mcpb "bundle/kicad-$V.mcpb"

      # Commit and push
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock .claude-plugin/plugin.json server.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }}"
          git push

      # Build
      - run: uv build

      # Create GitHub release
      - name: Create release
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes \
            dist/* bundle/*.mcpb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to PyPI
      - uses: pypa/gh-action-pypi-publish@release/v1
