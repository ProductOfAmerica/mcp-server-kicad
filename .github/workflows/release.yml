name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - run: uv sync --frozen --all-extras --dev

      # Lint
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

      # Test
      - run: uv run pytest -v -n auto

      # Bump version (uv version re-locks, so no separate uv lock step)
      - name: Bump version
        id: bump
        run: |
          V=$(uv version --bump "${{ inputs.bump }}" --short)
          node -e 'const fs=require("fs"),p=".claude-plugin/plugin.json",d=JSON.parse(fs.readFileSync(p,"utf8"));d.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(d,null,2)+"\n")' "$V"
          # server.json carries the version twice: the server's own version and
          # the PyPI package it points at. The MCP Registry rejects a package
          # version that is not live on PyPI, so both track the release.
          node -e 'const fs=require("fs"),p="server.json",d=JSON.parse(fs.readFileSync(p,"utf8"));d.version=process.argv[1];d.packages[0].version=process.argv[1];fs.writeFileSync(p,JSON.stringify(d,null,2)+"\n")' "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Commit and push
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock .claude-plugin/plugin.json server.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }}"
          git push

      # Build
      - run: uv build

      # Create GitHub release
      - name: Create release
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes \
            dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to PyPI
      - uses: pypa/gh-action-pypi-publish@release/v1

      # Publish to the MCP Registry. Last on purpose: it validates that the PyPI
      # package version is already live, and a failure here leaves the PyPI and
      # GitHub releases intact, needing only a manual `mcp-publisher publish`.
      #
      # github-oidc is what removes the human: the interactive `login github`
      # device flow mints a Registry JWT that expires five minutes later
      # (measured 2026-08-10), so a hand-run publish is a race against the clock
      # every single release. OIDC uses the id-token permission declared above.
      - name: Publish to the MCP Registry
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xzf - mcp-publisher
          ./mcp-publisher login github-oidc
          # PyPI serves a new version through a CDN, so the registry can still be
          # unable to see it for a few seconds after the publish step returns.
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "attempt $attempt failed; waiting for PyPI to serve ${{ steps.bump.outputs.version }}"
            sleep 30
          done
          exit 1
