name: Test ladder (nightly)

# The test ladder's large generated runs: every tests/test_ladder_*.py file under
# Hypothesis's "nightly" profile (randomized, 5000 examples a test), which also runs
# the tests marked @pytest.mark.nightly that drive kicad-cli or pcbnew with generated
# inputs. Pushes and pull requests run the same files under the small derandomized
# "ci" profile instead; see tests/conftest.py.
#
# GitHub runs a schedule only from the default branch, so this file does nothing
# for a branch until it reaches main. Until then, and for any change to the nightly
# set, run the same command locally before merging:
#   HYPOTHESIS_PROFILE=nightly uv run pytest -n auto -rs tests/test_ladder_*.py
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: nightly (KiCad ${{ matrix.kicad }})
    # Pinned, and installed exactly as kicad-suite.yml installs it, for the same
    # reasons that file gives.
    runs-on: ubuntu-24.04
    # Measured locally on 16 cores: the whole installed corpus alone is minutes of
    # CPU, and each nightly kicad-cli test is budgeted to minutes.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The PPA series names, ppa:kicad/kicad-<series>-releases.
        kicad: ["9.0", "10.0"]
    env:
      KICAD_SERIES: ${{ matrix.kicad }}
    steps:
      - uses: actions/checkout@v7

      - name: Install KiCad ${{ matrix.kicad }}
        run: |
          sudo add-apt-repository -y "ppa:kicad/kicad-${KICAD_SERIES}-releases"
          sudo apt-get update
          sudo apt-get install -y kicad kicad-packages3d-

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"
      - run: uv sync --frozen --all-extras --dev

      # Fatal: a leg that resolved another major would test the wrong KiCad.
      - name: Confirm the leg runs the KiCad it is named for
        run: |
          uv run python - <<'PY'
          import os
          import subprocess

          from mcp_server_kicad._freerouting import pcbnew_major
          from mcp_server_kicad._shared import _find_kicad_cli

          want = int(os.environ["KICAD_SERIES"].split(".")[0])
          cli = _find_kicad_cli()
          assert cli, "no kicad-cli resolved"
          version = subprocess.run(
              [cli, "version"], capture_output=True, text=True, check=True
          ).stdout.strip()
          print("kicad-cli version:", version)
          print("pcbnew major     :", pcbnew_major())
          assert int(version.split(".")[0]) == want, (version, want)
          assert pcbnew_major() == want, (pcbnew_major(), want)
          PY

      - name: Run the ladder under the nightly profile
        env:
          HYPOTHESIS_PROFILE: nightly
        run: uv run pytest -n auto -rs tests/test_ladder_*.py
