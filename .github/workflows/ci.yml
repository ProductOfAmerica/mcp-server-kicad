name: CI
on:
  push:
    branches: [main, master, "ci/**"]
  pull_request:
    branches: [main, master]
    # A pull request touching only these files runs nothing here: no test or
    # lint step reads any of them. Markdown is not on the list, because ruff
    # format --check . reads the Python blocks in every .md (kicad-suite.yml,
    # which runs no ruff, skips Markdown-only PRs too). Pushes to main and ci/**
    # are not filtered: release.yml refuses a commit without its own green push
    # runs. If a ruleset ever requires one of these jobs, a PR touching only
    # these files would wait on it forever.
    paths-ignore:
      - "NOTICE"
      - ".coderabbit.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
      - ".github/dependabot.yml"
      - ".github/assets/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          # Same cache key as test (3.11). Only that job saves it, because two
          # jobs saving one key race and the loser fails with a warning.
          save-cache: false
      - run: uv sync --frozen --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # python-version exports UV_PYTHON, which outranks .python-version. It is
      # also what keeps the legs on separate cache keys. actions/setup-python
      # did neither: uv kept resolving .python-version (then 3.10), so every
      # leg ran 3.10 (run 36915736772, 2026-10-01: the 3.11, 3.12 and 3.13
      # legs all reported Python 3.10.21).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --all-extras --dev
      - name: Confirm the leg runs the Python it is named for
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: uv run python -c "import os, sys; v = '%d.%d' % sys.version_info[:2]; assert v == os.environ['EXPECTED'], (v, os.environ['EXPECTED'])"
      - run: uv run pytest -v -n auto
