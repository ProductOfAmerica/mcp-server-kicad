name: Windows discovery

# Separate from ci.yml, and on the same trigger as macos-discovery.yml, because
# installing KiCad costs minutes of wall clock and this does not need to gate
# every pull request.
#
# It exists because Windows was the one platform with no runner at all, and
# three Windows-specific bugs reached a user before anyone noticed:
# kicad-cli living in a versioned install folder that the installer keeps off
# PATH, Defender's Controlled Folder Access killing kicad-cli at startup, and a
# write path that could truncate a schematic. A maintainer machine has the
# KICAD_* overrides set and ci.yml installs no KiCad, so neither could see them.
on:
  workflow_dispatch:
  push:
    branches: [main, master, "ci/**"]

jobs:
  discovery:
    runs-on: windows-latest
    timeout-minutes: 45
    # Windows runners default to PowerShell, where the heredocs below are a
    # parse error. Git Bash ships on the image.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      # Installed from KiCad's own download rather than through Chocolatey.
      #
      # The community feed stopped serving the package on 2026-08-15: four
      # consecutive attempts across ten minutes answered "kicad not installed.
      # The package was not found with the source(s) listed", having installed
      # fine an hour earlier. Before that, on 2026-08-12, it returned 504 and
      # `choco install` still exited 0 on "installed 0/0 packages", so the run
      # failed three steps later as "no kicad-cli found; PATH said None", which
      # reads like the _KICAD_WIN_DIRS probe regressed rather than like KiCad
      # was never installed.
      #
      # Chocolatey was only ever an index. Its package points at the same file
      # this downloads, which downloads.kicad.org 307s to on s3.cern.ch, so
      # dropping it removes a failure mode without changing a byte of what is
      # fetched. The version is pinned rather than discovered on purpose: this
      # is one of the two KiCad 10 gates, and which KiCad it ran against should
      # be a fact in the file rather than whatever was newest that morning.
      - name: Install KiCad
        shell: pwsh
        run: |
          $version = '10.0.5'
          $exe = "$env:RUNNER_TEMP\kicad-$version-x86_64.exe"
          $url = "https://downloads.kicad.org/kicad/windows/explore/stable/download/kicad-$version-x86_64.exe"
          Write-Host "downloading $url"
          # Invoke-WebRequest's progress rendering costs minutes on a ~923 MB
          # file in a non-interactive host; curl.exe ships on the runner image.
          curl.exe -sSfL --retry 3 --retry-delay 10 -o $exe $url
          $size = (Get-Item $exe).Length
          Write-Host "downloaded $size bytes"
          if ($size -lt 500MB) { throw "installer is only $size bytes; the download did not complete." }
          # /S is the NSIS silent switch and has to be uppercase; /allusers is
          # what puts it under Program Files rather than asking for a scope.
          # Both come from winget's own KiCad manifest, which is the thing that
          # makes `winget install KiCad.KiCad` work: InstallerType nullsoft
          # (hence /S) with Custom "/allusers" on the machine-scope entry.
          # Measured 2026-08-15: /S alone exited 666660 after three seconds,
          # having installed nothing.
          $p = Start-Process -FilePath $exe -ArgumentList '/S','/allusers' -Wait -PassThru
          Write-Host "installer exited $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "the installer exited $($p.ExitCode)." }
          # The guard stays, and it is what attributed both outages above to
          # this step rather than to a probe three steps later.
          $cli = Get-ChildItem 'C:\Program Files\KiCad' -Recurse -Filter kicad-cli.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cli) { throw "KiCad $version did not install: no kicad-cli.exe under C:\Program Files\KiCad." }
          Write-Host "installed: $($cli.FullName)"
          & $cli.FullName version

      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --all-extras --dev

      # Non-fatal. This is the only place we see a real Windows install, so
      # record the layout even when everything passes.
      - name: Report the Windows layout
        continue-on-error: true
        run: |
          uv run python - <<'PY'
          import shutil
          from mcp_server_kicad._shared import _KICAD_WIN_DIRS, _find_kicad_cli, _kicad_root
          from mcp_server_kicad._shared import _resolve_system_lib
          from mcp_server_kicad._freerouting import find_pcbnew_python

          print("probed roots     :", _KICAD_WIN_DIRS)
          print("shutil.which     :", shutil.which("kicad-cli"))
          print("_find_kicad_cli():", _find_kicad_cli())
          print("_kicad_root()    :", _kicad_root())
          print("Device.kicad_sym :", _resolve_system_lib("Device"))
          print("find_pcbnew_python:", find_pcbnew_python()[0])

          root = _kicad_root()
          if root:
              for p in sorted(root.iterdir()):
                  print("   ", p.name + ("/" if p.is_dir() else ""))
          PY

      # The reason for installing KiCad rather than running a bare suite: the
      # Windows install-folder probe has only ever been tested against
      # synthetic directory trees. This is the first time it meets a real one.
      - name: Resolve a stock install with nothing on PATH
        run: |
          uv run python - <<'PY'
          import os, shutil
          from mcp_server_kicad._shared import _find_kicad_cli

          for var in [k for k in os.environ if k.startswith("KICAD_")]:
              del os.environ[var]
          _find_kicad_cli.cache_clear()

          on_path = shutil.which("kicad-cli")
          resolved = _find_kicad_cli()
          assert resolved, f"no kicad-cli found; PATH said {on_path!r}"
          assert os.path.isfile(resolved), resolved
          print("ok:", on_path, "->", resolved)
          PY

      - name: Full test suite against installed KiCad
        run: uv run pytest -v -rA --tb=short -n auto
